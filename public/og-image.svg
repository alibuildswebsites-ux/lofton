<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Accent shapes -->
  <circle cx="150" cy="100" r="80" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="1100" cy="550" r="120" fill="#8b5cf6" opacity="0.1"/>
  
  <!-- Center logo area -->
  <g transform="translate(600, 315)">
    <!-- House icon (from preloader) -->
    <g transform="translate(-50, -50)">
      <path
        d="M3 9.5L12 3L21 9.5V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V9.5Z"
        stroke="url(#accentGradient)"
        strokeWidth="2.5"
        strokeLinecap="round"
        strokeLinejoin="round"
        fill="none"
      />
      <path
        d="M9 21V12H15V21"
        stroke="url(#accentGradient)"
        strokeWidth="2.5"
        strokeLinecap="round"
        strokeLinejoin="round"
        fill="none"
      />
    </g>
  </g>
  
  <!-- Main text -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="white">
    Lofton Realty
  </text>
  
  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#d1d5db">
    Houston Real Estate Experts
  </text>
  
  <!-- Descriptive text -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#9ca3af">
    Buy • Sell • Invest • 24/7 Service
  </text>
  
  <!-- Accent line -->
  <line x1="400" y1="565" x2="800" y2="565" stroke="url(#accentGradient)" stroke-width="3"/>
</svg>